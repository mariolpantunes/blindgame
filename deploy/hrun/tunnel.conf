# /etc/nginx/conf.d/tunnel.conf on hrun
# Public end of the frp tunnel (frps container, ~/services/compose.yml). The laptop app:
#   /~!frp -> 127.0.0.1:7000  frpc control connection (websocket, transport.protocol = "wss")
#   /      -> 127.0.0.1:7080  frps HTTP vhost, routed by Host to the laptop's frpc
server {
    listen 80;
    server_name tunnel.hrun.mooo.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html/acme-challenge/;
    }

    # Redirecionar para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    server_name tunnel.hrun.mooo.com;

    listen 443 quic;
    listen [::]:443 quic;
    http3 on;

    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_certificate     /etc/ssl/certs/tunnel.hrun.mooo.com.pem;
    ssl_certificate_key /etc/ssl/private/tunnel.hrun.mooo.com.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Alt-Svc 'h3=":443";ma=86400';
    add_header x-quic 'h3';

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # frpc control channel: one long-lived websocket per laptop.
    location ^~ /~!frp {
        proxy_pass http://127.0.0.1:7000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # The tunnelled app (HTTP + websockets).
    location / {
        include /etc/nginx/snippets/drop-scanners.conf;
        proxy_pass http://127.0.0.1:7080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_redirect off;

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        proxy_buffering off;
    }
}
