# blindgame contest file. Copy to contest.yaml, edit, and start the server:
#   venv/bin/python -m blindgame --config contest.yaml
#
# Every start is a new game: without a pinned `seed` the order of the functions and
# every hidden instance change. Students who drop resume; after a restart they rejoin.
# All solutions are computed and stored before the server accepts students.

id: blindgame                 # database key (+ the run's seed): letters, digits, . _ -
# seed: 2026                 # optional: pin to replay a run; default = a fresh game (clock) at every start

dim: 2                        # v0.1.0 plays in 2D (the reveal's colour map needs 2D)
problems: 8                   # a count (seeded random pick) or a list; played in a shuffled order, e.g.
#   [Sphere, Rastrigin, Ackley, Rosenbrock, Griewank, Styblinski-Tang,
#    Levy, Zakharov, Dixon-Price, Schwefel, Lunacek]
budget: 4D+D                  # evaluations per problem, a formula in D: 4D+D (= 10 in 2D), 3D+D, D^2+1, 2^D+1, or a number

code: ""                      # optional join code; empty = anyone with the link can join
status: open                  # open | closed (closed: no more evaluations, board stays)

reveal:                       # shown after each problem: pyBlindOpt as the reference solution
  algorithms:                 # pyBlindOpt optimizers to run on the student's instance
    - Random Search
    - Hill Climbing
    - Particle Swarm
    - Differential Evolution
    - Grey Wolf
  runs: 10                    # seeds per optimizer, for "you beat N% of runs"
  epochs: 100                 # epochs per run; each starts from an OBLESA population of `budget` points
